
name: IMES Automatic AWS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imes-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy IMES
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular for production
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Verify Angular build
        run: |
          test -f frontend/dist/imes/browser/index.html

      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          for name in EC2_HOST EC2_USER SSH_KEY HOST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty"
              exit 1
            fi
          done
          echo "All deployment secrets are configured."

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Deploying IMES to AWS EC2..."

          rsync -rltz --delete \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            frontend/dist/imes/browser/ \
            "${EC2_USER}@${EC2_HOST}:/var/www/imes/"

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            "http://${EC2_HOST}/login" > /dev/null

          echo "IMES deployment completed successfully!!"
