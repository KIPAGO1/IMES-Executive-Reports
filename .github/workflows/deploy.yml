
name: IMES Automatic AWS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imes-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy IMES
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular for production
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Verify Angular build
        run: |
          test -f frontend/dist/imes/browser/index.html

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts



        - name: Deploy to AWS EC2
          env:
            EC2_HOST: ${{ secrets.EC2_HOST }}
            EC2_USER: ${{ secrets.EC2_USER }}
          run: |
            if [ -z "$EC2_HOST" ]; then
              echo "::error::EC2_HOST secret is missing or empty"
              exit 1
            fi

            if [ -z "$EC2_USER" ]; then
              echo "::error::EC2_USER secret is missing or empty"
              exit 1
            fi

            echo "Deploying IMES to AWS..."

            rsync -rltz --delete \
              --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
              frontend/dist/imes/browser/ \
              "${EC2_USER}@${EC2_HOST}:/var/www/imes/"


      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            "http://${EC2_HOST}/login" > /dev/null