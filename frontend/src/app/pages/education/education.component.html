<section class="edu"><h1>{{'educationTitle'|tr}}</h1><div class="filters"><label>{{'academicYear'|tr}}<select [(ngModel)]="year"><option>2026</option><option>2025</option><option>2024</option></select></label><label>{{'region'|tr}}<select [(ngModel)]="region" (ngModelChange)="setRegion()"><option value="all">{{'all'|tr}}</option><option *ngFor="let r of regionNames" [value]="r">{{r}}</option></select></label><label>{{'district'|tr}}<select [(ngModel)]="district" [disabled]="region==='all'"><option value="all">{{'allPlural'|tr}}</option></select></label><label>{{'educationLevel'|tr}}<select [(ngModel)]="level"><option value="all">{{'allPlural'|tr}}</option><option value="primary">{{'primary'|tr}}</option><option value="secondary">{{'secondary'|tr}}</option></select></label><label>{{'class'|tr}}<select [(ngModel)]="classLevel"><option value="all">{{'all'|tr}}</option><option *ngFor="let n of [1,2,3,4,5,6,7]" [value]="n">{{n}}</option></select></label><button (click)="apply()">{{'apply'|tr}}</button></div><div class="kpis"><div class="kpi" *ngFor="let k of kpis;let i=index" [class.filled]="i<4" [attr.data-tone]="i"><span class="circle"><img src="assets/elimu.png" alt=""/></span><div>{{k.name}}</div><strong>{{k.value}}</strong></div></div><div class="charts"><article><h2>{{'genderChart'|tr}}</h2><div id="genderChart" class="chart"></div></article><article><h2>{{'trendChart'|tr}}</h2><div id="trendChart" class="chart"></div></article><article class="wide"><h2>{{'regionChart'|tr}}</h2><div id="regionChart" class="chart tall"></div></article></div><p class="warning">{{'demoWarning'|tr}}</p></section>
